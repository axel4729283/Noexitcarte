<!doctype html>  
<html lang="fr">  
<head>  
<meta charset="utf-8">  
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">  
<meta name="theme-color" content="#0c0e11">  
<title>Urbex France</title>  
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">  
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">  
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">  
<script src="https://cdn.tailwindcss.com/3.4.17"></script>  
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>  
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>  
<style>  
:root{--a:#ffb224;--ln:#2a2f38}  
html,body{height:100%;margin:0;background:#0c0e11;color:#e6e8ec;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}  
#map{position:fixed;inset:0;z-index:0;background:#0c0e11}  
.t-a{color:var(--a)}  
.pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 3px 10px #000a}  
.pin span{transform:rotate(45deg);font-size:16px;line-height:1}  
.pin.pend{border-style:dashed;opacity:.7}  
.pill{border:1px solid var(--ln);border-radius:999px;padding:.2rem .65rem}  
.btn{flex:1;text-align:center;border:1px solid var(--ln);background:#1a1e25;border-radius:.75rem;padding:.55rem .75rem;font-size:.85rem}  
.btn:active,.btn.sel{background:var(--a);border-color:var(--a);color:#111}  
.inp{width:100%;background:#0c0e11;border:1px solid var(--ln);border-radius:.6rem;padding:.55rem .7rem;font-size:16px}  
.chip{border:1px solid var(--ln);border-radius:999px;padding:.3rem .65rem;font-size:.8rem;opacity:.45}  
.chip.on{opacity:1;border-color:var(--a);background:#1a1e25}  
.panel{background:rgba(18,21,26,.94);backdrop-filter:blur(8px);border:1px solid var(--ln)}  
</style>  
</head>  
<body>  
<div id="map"></div>  
  
<header class="fixed top-0 inset-x-0 z-[1000] p-2 flex gap-2 items-center" style="padding-top:max(.5rem,env(safe-area-inset-top))">  
  <div class="panel flex-1 max-w-xl flex items-center gap-1 rounded-2xl p-1.5 shadow-xl">  
    <b class="hidden sm:block px-2 t-a">Urbex France</b>  
    <form id="sf" class="flex-1 flex"><input id="q" class="inp !border-0 !bg-transparent" placeholder="Ville ou région…" enterkeyhint="search"><button class="btn !flex-none">🔎</button></form>  
    <button id="fb" class="btn !flex-none">Filtres</button>  
  </div>  
  <button id="pb" class="btn hidden !flex-none">⚠ <span id="pn"></span></button>  
  <button id="ab" class="btn !flex-none" aria-label="Administration">🔒</button>  
</header>  
  
<div id="fp" class="panel hidden fixed z-[1000] left-2 right-2 md:right-auto md:w-96 rounded-2xl p-3 space-y-2 shadow-2xl overflow-y-auto" style="top:calc(4rem + env(safe-area-inset-top));max-height:65vh">  
  <p class="text-xs text-zinc-400">Catégorie</p><div id="fc" class="flex flex-wrap gap-1.5"></div>  
  <p class="text-xs text-zinc-400">Niveau de danger</p><div id="fd" class="flex flex-wrap gap-1.5"></div>  
  <p class="text-xs text-zinc-400">Accessibilité</p><div id="fa" class="flex flex-wrap gap-1.5"></div>  
  <div class="flex items-center gap-2"><span id="cnt" class="text-xs text-zinc-500 flex-1"></span><button id="fr" class="btn !flex-none">Tout afficher</button></div>  
</div>  
  
<div id="hint" class="panel hidden fixed z-[1000] inset-x-3 md:inset-x-auto md:left-1/2 md:-translate-x-1/2 md:w-[460px] rounded-2xl p-3 flex items-center gap-2 text-sm shadow-2xl" style="bottom:calc(6.5rem + env(safe-area-inset-bottom));border-color:var(--a)">  
  <span class="flex-1">📍 Touchez la carte pour placer le repère</span>  
  <button id="hf" class="btn !flex-none">Formulaire</button><button id="hx" class="btn !flex-none" aria-label="Annuler">✕</button>  
</div>  
  
<button id="fab" aria-label="Ajouter un lieu" class="fixed z-[1050] right-5 w-16 h-16 rounded-full text-4xl leading-none text-[#111] active:scale-95 transition" style="bottom:calc(1.25rem + env(safe-area-inset-bottom));background:var(--a);box-shadow:0 8px 28px rgba(255,178,36,.45)">+</button>  
  
<aside id="sheet" class="panel hidden fixed z-[1100] inset-x-0 bottom-0 md:inset-y-0 md:left-auto md:right-0 md:w-[420px] rounded-t-2xl md:rounded-none overflow-y-auto shadow-2xl" style="max-height:82vh"></aside>  
  
<div id="modal" class="hidden fixed inset-0 z-[1200] bg-black/70 items-end md:items-center justify-center flex">  
  <form id="f" class="panel w-full md:w-[540px] overflow-y-auto rounded-t-2xl md:rounded-2xl p-4 space-y-3" style="max-height:94vh">  
    <div class="flex justify-between items-center"><h2 id="mt" class="text-lg font-bold">Ajouter un lieu</h2><button type="button" id="mx" class="text-2xl px-2" aria-label="Fermer">×</button></div>  
    <input name="title" required minlength="3" maxlength="120" class="inp" placeholder="Titre (ex : Usine abandonnée X)">  
    <div class="grid grid-cols-2 gap-2">  
      <label class="text-xs text-zinc-400">Catégorie<select name="category" class="inp mt-1"></select></label>  
      <label class="text-xs text-zinc-400">Accessibilité<select name="access" class="inp mt-1"></select></label>  
      <label class="text-xs text-zinc-400 col-span-2">Niveau de danger<select name="danger" class="inp mt-1"></select></label>  
    </div>  
    <textarea name="description" rows="4" maxlength="4000" class="inp" placeholder="Description, historique, conseils d’accès…"></textarea>  
    <div class="rounded-xl border border-zinc-800 p-3 space-y-2">  
      <p class="text-xs text-zinc-400">Localisation : <b id="coord" class="t-a">non définie</b></p>  
      <div class="flex gap-2"><input id="addr" class="inp" placeholder="Adresse ou ville"><button type="button" id="ag" class="btn !flex-none">🔎</button></div>  
      <div class="flex gap-2"><button type="button" id="geo" class="btn">📍 Ma position</button><button type="button" id="onmap" class="btn">🗺️ Sur la carte</button></div>  
    </div>  
    <label class="text-xs text-zinc-400 block">Photos (5 Mo max chacune)<input id="files" type="file" accept="image/*" multiple class="inp mt-1 text-sm"></label>  
    <textarea name="urls" rows="2" class="inp" placeholder="Ou liens d’images (un par ligne)"></textarea>  
    <button type="submit" class="btn w-full !font-semibold" style="background:var(--a);border-color:var(--a);color:#111">Publier</button>  
  </form>  
</div>  
  
<div id="toast" class="hidden fixed z-[1300] left-1/2 -translate-x-1/2 bg-zinc-900 border border-zinc-700 rounded-full px-4 py-2 text-sm shadow-xl" style="top:calc(4.5rem + env(safe-area-inset-top))"></div>  
  
<script>  
/* ===== CONFIG : colle ici l’URL et la clé « anon public » de ton projet Supabase ===== */  
const SB_URL='https://VOTRE-PROJET.supabase.co',SB_KEY='VOTRE_CLE_ANON_PUBLIQUE';  
  
const CAT={usine:['🏭','Usine / industriel'],maison:['🏚️','Maison / manoir'],hopital:['🏥','Hôpital / asile'],eglise:['⛪','Église / couvent'],chateau:['🏰','Château'],militaire:['🪖','Militaire / bunker'],ecole:['🏫','École'],autre:['📍','Autre']};  
const ACC={facile:['🟢','Facile'],moyen:['🟠','Moyen'],difficile:['🔴','Difficile / escalade']};  
const DNG={faible:['#3fb950','Faible'],effondrement:['#f0883e','Risque d’effondrement'],gardien:['#d4a72c','Gardien / alarme'],amiante:['#a371f7','Amiante / gaz'],dangereux:['#f85149','Dangereux']};  
  
const sb=supabase.createClient([https://bprsxfrscxmwqqohyzbb.supabase.co](https://bprsxfrscxmwqqohyzbb.supabase.co), sb_publishable_hh65k09ofnvS1_rkBaSRxw_I9d01qD8),$=s=>document.querySelector(s);  
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');  
const safe=u=>/^https?:\/\//i.test(u);  
const ic=v=>v[0][0]==='#'?`<i style="background:${v[0]};width:.6rem;height:.6rem;border-radius:9px;display:inline-block;margin-right:.35rem"></i>`:v[0]+' ';  
const opts=o=>Object.entries(o).map(([k,v])=>`<option value="${k}">${v[0][0]==='#'?'':v[0]+' '}${v[1]}</option>`).join('');  
let spots=[],admin=false,cur=null,placing=false,formOn=false,draft={},pi=0;  
const flt={c:new Set(Object.keys(CAT)),d:new Set(Object.keys(DNG)),a:new Set(Object.keys(ACC))};  
const voter=localStorage.uid||(localStorage.uid=crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now());  
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add('hidden'),3200)}  
  
/* ===== Carte sombre + marqueurs ===== */  
const map=L.map('map',{zoomControl:false}).setView([46.6,2.4],6);  
L.control.zoom({position:'bottomleft'}).addTo(map);  
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap · © CARTO',maxZoom:19}).addTo(map);  
const cl=L.markerClusterGroup({maxClusterRadius:45}).addTo(map);  
  
function render(){  
  cl.clearLayers();let n=0;  
  spots.forEach(s=>{  
    if(!(flt.c.has(s.category)&&flt.d.has(s.danger)&&flt.a.has(s.access)))return;n++;  
    const col=(DNG[s.danger]||DNG.faible)[0],e=(CAT[s.category]||CAT.autre)[0];  
    L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',iconSize:[34,34],iconAnchor:[17,40],html:`<div class="pin ${s.status==='active'?'':'pend'}" style="background:${col}"><span>${e}</span></div>`})}).on('click',()=>openSpot(s.id)).addTo(cl);  
  });  
  $('#cnt').textContent=n+' / '+spots.length+' lieux affichés';  
  const p=spots.filter(s=>s.status!=='active').length;  
  $('#pb').classList.toggle('hidden',!(admin&&p));$('#pn').textContent=p;  
}  
async function load(){  
  const {data,error}=await sb.from('spots').select('*').order('created_at',{ascending:false});  
  if(error)return toast('Base inaccessible : '+error.message);  
  spots=data;render();  
}  
  
/* ===== Filtres & recherche ===== */  
[['#fc',CAT,'c'],['#fd',DNG,'d'],['#fa',ACC,'a']].forEach(([id,o,k])=>{  
  const el=$(id);  
  el.innerHTML=Object.entries(o).map(([key,v])=>`<button type="button" data-k="${key}" class="chip on">${ic(v)}${v[1]}</button>`).join('');  
  el.onclick=e=>{const b=e.target.closest('button');if(!b)return;const s=flt[k];s.has(b.dataset.k)?s.delete(b.dataset.k):s.add(b.dataset.k);b.classList.toggle('on');render()};  
});  
$('#fr').onclick=()=>{[['c',CAT],['d',DNG],['a',ACC]].forEach(([k,o])=>flt[k]=new Set(Object.keys(o)));document.querySelectorAll('.chip').forEach(c=>c.classList.add('on'));render()};  
$('#fb').onclick=()=>$('#fp').classList.toggle('hidden');  
async function geo(q){const r=await fetch('[https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=fr&accept-language=fr&q='+encodeURIComponent(q));return](https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=fr&accept-language=fr&q='+encodeURIComponent(q));return) (await r.json())[0]}  
$('#sf').onsubmit=async e=>{  
  e.preventDefault();const q=$('#q').value.trim();if(!q)return;  
  try{const g=await geo(q);if(!g)return toast('Lieu introuvable en France');const b=g.boundingbox;map.fitBounds([[b[0],b[2]],[b[1],b[3]]],{maxZoom:14});$('#fp').classList.add('hidden')}  
  catch{toast('Recherche indisponible')}  
};  
  
/* ===== Fiche d’un lieu ===== */  
function closeSheet(){$('#sheet').classList.add('hidden');$('#fab').classList.remove('hidden');cur=null;history.replaceState(null,'',location.pathname+location.search)}  
function openSpot(id,fly){  
  const s=spots.find(x=>x.id===id);if(!s)return;  
  cur=id;history.replaceState(null,'','#spot='+id);if(fly)map.setView([s.lat,s.lng],15);  
  const c=CAT[s.category]||CAT.autre,a=ACC[s.access]||ACC.moyen,d=DNG[s.danger]||DNG.faible,ph=(s.photos||[]).filter(safe),mv=localStorage['v_'+id],sh=$('#sheet');  
  sh.innerHTML=`  
  <div class="sticky top-0 z-10 flex justify-between items-center p-3 panel !border-0"><span class="text-sm text-zinc-400">${c[0]} ${c[1]}</span><button onclick="closeSheet()" class="text-2xl px-2" aria-label="Fermer">×</button></div>  
  ${ph.length?`<div class="flex gap-2 overflow-x-auto px-3 pb-2">${ph.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" loading="lazy" alt="" class="h-44 max-w-none rounded-lg"></a>`).join('')}</div>`:''}  
  <div class="p-4 space-y-3">  
    <h2 class="text-xl font-bold">${esc(s.title)}</h2>  
    ${s.status!=='active'?`<div class="rounded-lg bg-amber-500/15 text-amber-300 text-sm p-2">⏳ En attente de vérification : des membres signalent que ce lieu n’existe plus.</div>`:''}  
    <div class="flex flex-wrap gap-2 text-xs"><span class="pill">${a[0]} ${a[1]}</span><span class="pill" style="border-color:${d[0]}">${ic(d)}${d[1]}</span></div>  
    <p class="whitespace-pre-line text-sm text-zinc-300">${esc(s.description)}</p>  
    <div class="rounded-xl border border-zinc-800 p-3">  
      <div class="text-sm font-semibold mb-2">Toujours là ? <span class="font-normal text-zinc-400">${s.still_yes} oui · ${s.still_no} non</span></div>  
      <div class="flex gap-2"><button class="btn ${mv==='1'?'sel':''}" onclick="vote('${s.id}',true)">👍 Oui, il existe</button><button class="btn ${mv==='0'?'sel':''}" onclick="vote('${s.id}',false)">💥 Démoli / fermé</button></div>  
    </div>  
    <div class="flex gap-2"><a class="btn" target="_blank" rel="noopener" href="[https://www.google.com/maps/dir/?api=1&destination=${s.lat},$](https://www.google.com/maps/dir/?api=1&destination=$%7Bs.lat%7D,$){s.lng}">🧭 Itinéraire</a><button class="btn" onclick="share('${s.id}')">🔗 Partager</button></div>  
    ${admin?`<div class="flex flex-wrap gap-2 border-t border-zinc-800 pt-3"><button class="btn" onclick="editSpot('${s.id}')">✏️ Modifier</button><button class="btn" onclick="keepSpot('${s.id}')">✅ Il existe : lever l’alerte</button><button class="btn !border-red-500 text-red-400" onclick="delSpot('${s.id}')">🗑 Supprimer</button></div>`:''}  
    <h3 class="font-semibold pt-2">Commentaires</h3>  
    <div id="cm" class="space-y-2 text-sm"></div>  
    <div class="space-y-2"><input id="cname" class="inp" maxlength="40" placeholder="Pseudo (facultatif)" value="${esc(localStorage.cname||'')}"><textarea id="cbody" class="inp" rows="2" maxlength="1000" placeholder="Conseil d’accès, retour d’expérience…"></textarea><button class="btn w-full" onclick="addCom('${s.id}')">Commenter</button></div>  
  </div>`;  
  sh.classList.remove('hidden');sh.scrollTop=0;$('#fab').classList.add('hidden');$('#fp').classList.add('hidden');loadCom(id);  
}  
async function loadCom(id){  
  const {data}=await sb.from('comments').select('*').eq('spot_id',id).order('created_at',{ascending:false});  
  const el=$('#cm');if(!el)return;  
  el.innerHTML=(data||[]).map(c=>`<div class="rounded-lg bg-zinc-900 p-2"><div class="text-xs text-zinc-500 flex justify-between"><span>${esc(c.author)} · ${new Date(c.created_at).toLocaleDateString('fr-FR')}</span>${admin?`<button onclick="delCom('${c.id}','${id}')" aria-label="Supprimer">✕</button>`:''}</div>${esc(c.body)}</div>`).join('')||'<p class="text-zinc-500">Aucun commentaire. Partagez un conseil d’accès !</p>';  
}  
async function addCom(id){  
  const body=$('#cbody').value.trim();if(!body)return;const author=$('#cname').value.trim()||'Anonyme';localStorage.cname=author==='Anonyme'?'':author;  
  const {error}=await sb.from('comments').insert({spot_id:id,author,body});  
  if(error)return toast(error.message);loadCom(id);$('#cbody').value='';  
}  
async function vote(id,yes){  
  const {error}=await sb.rpc('vote',{p_spot:id,p_voter:voter,p_still:yes});  
  if(error)return toast(error.message);  
  localStorage['v_'+id]=yes?'1':'0';toast('Merci pour votre vote !');await load();openSpot(id);  
}  
function share(id){const u=location.origin+location.pathname+'#spot='+id;navigator.share?navigator.share({title:'Urbex France',url:u}).catch(()=>{}):navigator.clipboard.writeText(u).then(()=>toast('Lien copié'))}  
  
/* ===== Ajout / modification ===== */  
const F=$('#f');  
F.elements.category.innerHTML=opts(CAT);F.elements.access.innerHTML=opts(ACC);F.elements.danger.innerHTML=opts(DNG);  
const showForm=on=>$('#modal').classList.toggle('hidden',!on);  
function setPos(la,ln){draft.lat=la;draft.lng=ln;$('#coord').textContent=la.toFixed(5)+', '+ln.toFixed(5);map.setView([la,ln],Math.max(map.getZoom(),15))}  
function openForm(s){  
  F.reset();draft={id:s.id,lat:null,lng:null};formOn=true;closeSheet();  
  const e=F.elements;e.title.value=s.title||'';e.category.value=s.category||'maison';e.access.value=s.access||'moyen';e.danger.value=s.danger||'faible';e.description.value=s.description||'';e.urls.value=(s.photos||[]).join('\n');  
  $('#mt').textContent=s.id?'Modifier le lieu':'Ajouter un lieu';$('#coord').textContent='non définie';  
  if(s.lat!=null)setPos(s.lat,s.lng);showForm(true);  
}  
function closeForm(){formOn=false;showForm(false)}  
function startPlacing(){placing=true;showForm(false);closeSheet();$('#fp').classList.add('hidden');$('#hint').classList.remove('hidden');map.getContainer().style.cursor='crosshair'}  
function stopPlacing(){placing=false;$('#hint').classList.add('hidden');map.getContainer().style.cursor=''}  
$('#fab').onclick=startPlacing;$('#onmap').onclick=startPlacing;$('#mx').onclick=closeForm;  
$('#hf').onclick=()=>{stopPlacing();formOn?showForm(true):openForm({})};  
$('#hx').onclick=()=>{stopPlacing();formOn&&showForm(true)};  
map.on('click',e=>{if(!placing)return;stopPlacing();if(formOn){setPos(e.latlng.lat,e.latlng.lng);showForm(true)}else openForm({lat:e.latlng.lat,lng:e.latlng.lng})});  
$('#geo').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>setPos(p.coords.latitude,p.coords.longitude),()=>toast('Position indisponible')):toast('Géolocalisation non supportée');  
$('#ag').onclick=async()=>{const q=$('#addr').value.trim();if(!q)return;try{const g=await geo(q);g?setPos(+g.lat,+g.lon):toast('Adresse introuvable')}catch{toast('Recherche indisponible')}};  
$('#addr').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#ag').click()}};  
async function upload(files){  
  const out=[];  
  for(const f of files){  
    const p=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+((f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg');  
    const {error}=await sb.storage.from('photos').upload(p,f,{contentType:f.type});  
    if(error){toast('Photo refusée : '+error.message);continue}  
    out.push(sb.storage.from('photos').getPublicUrl(p).data.publicUrl);  
  }  
  return out;  
}  
F.onsubmit=async e=>{  
  e.preventDefault();if(draft.lat==null)return toast('Définissez d’abord l’emplacement');  
  const b=F.querySelector('[type=submit]'),fd=Object.fromEntries(new FormData(F)),id=draft.id;b.disabled=true;  
  const urls=fd.urls.split('\n').map(x=>x.trim()).filter(safe),up=await upload([...$('#files').files]);  
  const row={title:fd.title.trim(),category:fd.category,access:fd.access,danger:fd.danger,description:fd.description.trim(),photos:[...urls,...up],lat:draft.lat,lng:draft.lng};  
  const {error}=await(id?sb.from('spots').update(row).eq('id',id):sb.from('spots').insert(row));  
  b.disabled=false;if(error)return toast(error.message);  
  closeForm();await load();toast(id?'Lieu modifié':'Lieu ajouté, merci !');id&&openSpot(id,true);  
};  
  
/* ===== Administration (modération manuelle) ===== */  
const editSpot=id=>openForm(spots.find(x=>x.id===id));  
async function delSpot(id){if(!confirm('Supprimer définitivement ce lieu et ses commentaires ?'))return;const {error}=await sb.from('spots').delete().eq('id',id);if(error)return toast(error.message);closeSheet();await load();toast('Lieu supprimé')}  
async function keepSpot(id){  
  await sb.from('votes').delete().eq('spot_id',id);await sb.from('admin_alerts').update({handled:true}).eq('spot_id',id);  
  const {error}=await sb.from('spots').update({status:'active',still_yes:0,still_no:0}).eq('id',id);  
  if(error)return toast(error.message);await load();openSpot(id);toast('Alerte levée')  
}  
async function delCom(c,id){await sb.from('comments').delete().eq('id',c);loadCom(id)}  
async function checkAdmin(s){admin=!!s&&(await sb.rpc('is_admin')).data===true;$('#ab').textContent=admin?'🔓':'🔒';render();cur&&openSpot(cur)}  
sb.auth.onAuthStateChange((_e,s)=>setTimeout(()=>checkAdmin(s),0));  
$('#ab').onclick=async()=>{  
  if(admin)return sb.auth.signOut();  
  const email=prompt('E-mail administrateur');if(!email)return;const password=prompt('Mot de passe');if(!password)return;  
  const {error}=await sb.auth.signInWithPassword({email,password});if(error)toast('Connexion refusée');  
};  
$('#pb').onclick=()=>{const p=spots.filter(s=>s.status!=='active');if(p.length)openSpot(p[pi++%p.length].id,true)};  
  
(async()=>{await load();const m=location.hash.match(/spot=([\w-]+)/);m&&openSpot(m[1],true)})();  
</script>  
</body>  
</html>
